name: Ad Agent Pipeline

on:
  workflow_dispatch: # Allows manual triggers anytime from GitHub website
  schedule:
    - cron: '0 6 * * 1' # Runs automatically every Monday at 06:00 UTC

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Prospecting & Pitch Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_pipeline.py

      - name: Commit and Push Generated Pitches and Updated Targets
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git status
          git add data/targets.csv generated_pitches/
          git status
          git diff --staged --quiet || git commit -m "chore: automated weekly pitch batch and tracker update [skip ci]"
          git push
