name: Ad Agent Pipeline

on:
  workflow_dispatch: # Allows you to run it manually anytime from GitHub website

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Prospecting & Pitch Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_pitch.py

      - name: Commit and Push Updated Targets CSV
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/targets.csv
          git diff --staged --quiet || git commit -m "chore: update outreach status and dates in targets.csv [skip ci]"
          git push
