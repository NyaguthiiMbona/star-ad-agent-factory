name: B2B Outreach Pipeline

on:
  schedule:
    # Runs every Tuesday at 15:00 UTC (6:00 PM EAT)
    - cron: '0 15 * * 2'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run B2B Pipeline Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          python scripts/run_pipeline.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/targets.csv generated_pitches/
          git diff --staged --quiet || git commit -m "chore: automated batch pitch generation and target status update"
          git push
