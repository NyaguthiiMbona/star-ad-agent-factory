name: B2B Outreach Pipeline

on:
  schedule:
    # Runs every Monday at 06:00 UTC (9:00 AM EAT)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run B2B Pipeline Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          python scripts/run_pipeline.py

      - name: Commit and Push Updated CSV and Pitches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/targets.csv generated_pitches/
          git diff-index --quiet HEAD || git commit -m "Automated B2B outreach run [skip ci]"
          git push
